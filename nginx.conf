server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index Vozz.html index.html;

  # Compressão
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cache agressivo para assets estáticos
  location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Não cachear HTML/JSX/JS — são editados com frequência no protótipo
  location ~* \.(html|jsx|js|css)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Rotas amigáveis: /crm → Vozz CRM.html, /login → Login.html
  location = /crm   { return 301 /Vozz%20CRM.html; }
  location = /login { return 301 /Login.html; }

  # Tenta servir o arquivo; se não existir, cai no landing
  location / {
    try_files $uri $uri/ /Vozz.html;
  }

  # Segurança básica
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
